[project]
name = "chronobox-ops"
version = "0.2.0"
description = "A benchmark of coding agents on live systems: did they solve the task, and what did they break on the way?"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jawher Jabri" }]
requires-python = ">=3.12"
dependencies = ["chronobox"]
keywords = ["benchmark", "ai-agents", "coding-agents", "devops", "sre", "llm-evaluation", "claude-code", "firecracker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/Geawher/chronobox-ops"
Results = "https://github.com/Geawher/chronobox-ops/blob/main/results/README.md"
Changelog = "https://github.com/Geawher/chronobox-ops/blob/main/CHANGELOG.md"
chronobox = "https://github.com/Geawher/chronobox"

[project.scripts]
chronobox-ops = "chronobox_ops.cli:main"

[tool.uv.sources]
# To develop both at once: uv add --editable ../chronobox (path to a local checkout).
chronobox = { git = "https://github.com/Geawher/chronobox.git", branch = "main" }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronobox_ops"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Task files embed shell and Python as data; long lines there are payload, not code.
"src/chronobox_ops/tasks/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["vm: needs /dev/kvm and a built chronobox VM image"]
