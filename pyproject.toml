[project]
name = "chronobox-ops"
version = "0.1.0"
description = "A benchmark of coding agents on live systems: did they solve the task, and what did they break on the way?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["chronobox"]

[project.scripts]
chronobox-ops = "chronobox_ops.cli:main"

[tool.uv.sources]
# Local checkout next to this one; on GitHub, point this at the chronobox repository.
chronobox = { path = "../chronobox", editable = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronobox_ops"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Task files embed shell and Python as data; long lines there are payload, not code.
"src/chronobox_ops/tasks/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["vm: needs /dev/kvm and a built chronobox VM image"]
