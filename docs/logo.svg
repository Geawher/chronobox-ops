<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="chronobox-ops">
  <!-- A minesweeper grid of machines: numbers hint at danger, one tile hides the trap and is flagged. -->
  <rect x="10" y="10" width="180" height="180" rx="40" fill="#172338"/>
  <g fill="#22314c">
    <rect x="44" y="44" width="32" height="32" rx="6"/><rect x="84" y="44" width="32" height="32" rx="6"/><rect x="124" y="44" width="32" height="32" rx="6"/>
    <rect x="44" y="84" width="32" height="32" rx="6"/><rect x="84" y="84" width="32" height="32" rx="6"/>
    <rect x="44" y="124" width="32" height="32" rx="6"/><rect x="84" y="124" width="32" height="32" rx="6"/><rect x="124" y="124" width="32" height="32" rx="6"/>
  </g>
  <!-- the numbers as strokes, so no font is needed: a "1" is a flag stroke, a stem and a foot -->
  <g fill="none" stroke="#2bb3a3" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M95 54 L101 50 V70 M95 70 H107"/><path d="M135 54 L141 50 V70 M135 70 H147"/>
    <path d="M95 94 L101 90 V110 M95 110 H107"/>
    <path d="M95 134 L101 130 V150 M95 150 H107"/><path d="M135 134 L141 130 V150 M135 150 H147"/>
  </g>
  <rect x="124" y="84" width="32" height="32" rx="6" fill="#4a5d80"/>
  <path d="M137 91 V109" stroke="#e8edf5" stroke-width="3" stroke-linecap="round"/>
  <path d="M137 91 L150 96 L137 101 Z" fill="#e8805a"/>
  <rect x="131" y="108" width="13" height="3" rx="1.5" fill="#e8edf5"/>
</svg>
